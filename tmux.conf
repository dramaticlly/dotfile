# Mouse support
set -g mouse on

# Vi mode for copy/search
setw -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -Tcopy-mode-vi Enter send -X copy-selection-and-cancel
bind-key -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

unbind [
bind Escape copy-mode

# Copy to system clipboard via OSC 52 (works over SSH to cloud workspaces)
set -s set-clipboard on

set -g history-limit 20000

# automatically renumber tmux windows
set -g renumber-windows on

# Start windows/panes at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Disable auto window rename
set-option -g allow-rename off

# make delay shorter
set -sg escape-time 0

######################
#### Key Bindings ####
######################
# Prefix: C-Space (avoids conflict with Claude Code's Ctrl-A readline binding)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# For nested tmux (cloud workspace uses default C-b):
# Local C-Space is intercepted here; inner tmux sees C-b normally
# Press C-Space then C-b to send C-b to inner tmux if needed
bind C-b send-keys C-b

# Quick window switching
bind-key C-Space last-window

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# split window and fix path
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane movement shortcuts (prefix + vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast pane switching with Shift+arrow (no prefix needed)
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# Resize panes with prefix + Shift+hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Display pane numbers longer
set -g display-panes-time 2000

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

######################
#### Coloring ####
######################
# Better terminal (tmux-256color works better with Mac Terminal for Option keys)
set -g default-terminal "tmux-256color"

tm_icon="♟"
tm_color_active=colour213
tm_color_inactive=colour241
tm_color_feature=colour4
tm_color_music=colour203

# separators
tm_separator_left_bold="◀"
tm_separator_left_thin="❮"
tm_separator_right_bold="▶"
tm_separator_right_thin="❯"

set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5


# default statusbar colors
# set-option -g status-bg colour0
set-option -g status-fg $tm_color_active
set-option -g status-bg default

# default window title colors
set-window-option -g window-status-style fg=$tm_color_inactive,bg=default
set -g window-status-format "#I #W"

# active window title colors
set-window-option -g window-status-current-style fg=$tm_color_active,bg=default
set-window-option -g  window-status-current-format "#[bold]#I #W"

# pane border
set-option -g pane-border-style fg=$tm_color_inactive
set-option -g pane-active-border-style fg=$tm_color_active

# message text
set-option -g message-style fg=$tm_color_active,bg=default

# pane number display
set-option -g display-panes-active-colour $tm_color_active
set-option -g display-panes-colour $tm_color_inactive

# clock
set-window-option -g clock-mode-colour $tm_color_active

tm_date="#[fg=$tm_color_inactive] %R %d %b"
tm_host="#[fg=$tm_color_feature,bold]#h"
tm_session_name="#[fg=$tm_color_feature,bold]$tm_icon #S"

set -g status-left $tm_session_name
set -g status-right $tm_date' '$tm_host

# color status bar
set -g status-bg colour235
set -g status-fg white

# highlight current window
set-window-option -g window-status-current-style fg=black,bg=green

# More obvious pane borders (from chan's config)
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour208 bold"
set -g pane-border-lines heavy

# Show pane info on borders (pane number + command)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=black bg=colour208 bold] #{pane_index}: #{pane_current_command} #[default], #[fg=colour245]#{pane_index}: #{pane_current_command} }"

# Synchronize panes toggle (send command to all panes at once)
bind s setw synchronize-panes

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
